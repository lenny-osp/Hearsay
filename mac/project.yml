# XcodeGen spec for Hearsay. Regenerate the project with
# Scripts/generate-project.sh; Hearsay.xcodeproj is not tracked.
name: Hearsay
options:
  bundleIdPrefix: tw.og1o
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # English is the development language; the interface is localized into
  # de, es, zh-Hant, and zh-Hans through the string catalogs in
  # Hearsay/Resources (Localizable, InfoPlist) and HearsayCore.
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  HearsayCore:
    path: HearsayCore
  HearsayWhisper:
    path: HearsayWhisper
targets:
  Hearsay:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Hearsay
        excludes:
          - Info.plist
          - Hearsay.entitlements
      # License texts shown in Settings > General > Acknowledgements.
      - path: ../LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: HearsayCore
        product: HearsayCore
      - package: HearsayWhisper
        product: HearsayWhisper
    info:
      path: Hearsay/Info.plist
      properties:
        CFBundleDisplayName: Hearsay
        CFBundleDevelopmentRegion: en
        # Interface languages (Settings > General > Interface language).
        CFBundleLocalizations: [en, de, es, zh-Hant, zh-Hans]
        # Set from the build settings below; the release workflow overrides
        # them (xcodebuild MARKETING_VERSION=0.2.0 CURRENT_PROJECT_VERSION=7).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # "owner/name" of the GitHub repository the update check asks for
        # its latest release (PLAN.md 4.6).
        HearsayUpdateRepository: $(HEARSAY_UPDATE_REPOSITORY)
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Hearsay records meetings you start and transcribes them on this Mac.
        NSAudioCaptureUsageDescription: Hearsay captures the audio of your calls so both sides of a meeting are transcribed.
    # The App Sandbox is off (owner decision 2026-09-28): Hearsay ships with
    # Developer ID only, never through the Mac App Store, and it runs the
    # user's installed GitHub Copilot CLI (a Node program that reads its own
    # login from the home folder) and writes to ~/Documents without an
    # open-panel detour. Hardened runtime stays on for notarization; the
    # audio-input entitlement is what the hardened runtime needs for the mic.
    entitlements:
      path: Hearsay/Hearsay.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.og1o.hearsay
        PRODUCT_NAME: Hearsay
        # Version shown in About Hearsay and Settings > General. Defaults for
        # local builds; .github/workflows/release.yml sets both from the tag
        # and the run number.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # The one place the update repository is set (Info.plist
        # HearsayUpdateRepository).
        HEARSAY_UPDATE_REPOSITORY: lenny-osp/Hearsay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        # Compiler-based string extraction for the string catalogs.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    scheme: {}
