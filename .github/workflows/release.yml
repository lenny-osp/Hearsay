# Publishes a GitHub release when a version tag is pushed (PLAN.md 4.7):
#   git tag v0.2.0 && git push origin v0.2.0
# The version shown in the app comes from the tag (without "v"), the build
# number from the run number. The release carries Hearsay-<version>.dmg and
# SHA256SUMS.txt. The in-app update check (PLAN.md 4.6) reads the latest
# release of this repository.
#
# Signing: without the secrets listed in .github/workflows/README.md the
# app is ad-hoc signed (the normal case today) and the release notes say how
# to open it the first time. With them, the app and the DMG are signed with
# Developer ID, notarized, and stapled. No step needs or downloads a model.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: "1"
      # Secrets cannot be tested in a step's `if:`; this is "true" only when
      # the Developer ID certificate secret exists.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mac

      - name: Version from the tag
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if [[ ! $version =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $tag is not a version (expected v1.2.3 or v1.2.3-beta.1)"; exit 1
          fi
          prerelease=false
          [[ $version == *-* ]] && prerelease=true
          {
            echo "VERSION=$version"
            echo "BUILD=${{ github.run_number }}"
            echo "PRERELEASE=$prerelease"
            echo "APP=mac/.build/derived/Build/Products/Release/Hearsay.app"
            echo "DMG=dist/Hearsay-$version.dmg"
          } >> "$GITHUB_ENV"
          echo "Releasing $version (build ${{ github.run_number }}, prerelease $prerelease)"

      - name: HearsayCore tests
        working-directory: mac/HearsayCore
        run: swift test

      - name: Build Release
        working-directory: mac
        run: Scripts/run-debug.sh --release --no-open --ci "MARKETING_VERSION=$VERSION" "CURRENT_PROJECT_VERSION=$BUILD"

      - name: Check the built Info.plist
        run: |
          plist="$APP/Contents/Info.plist"
          plutil -p "$plist" | grep -E 'CFBundleShortVersionString|CFBundleVersion|HearsayUpdateRepository'
          [[ $(plutil -extract CFBundleShortVersionString raw -o - "$plist") == "$VERSION" ]] \
            || { echo "::error::CFBundleShortVersionString is not $VERSION"; exit 1; }
          [[ $(plutil -extract CFBundleVersion raw -o - "$plist") == "$BUILD" ]] \
            || { echo "::error::CFBundleVersion is not $BUILD"; exit 1; }
          repository=$(plutil -extract HearsayUpdateRepository raw -o - "$plist")
          [[ -n $repository && $repository != *'$('* ]] \
            || { echo "::error::HearsayUpdateRepository is not set"; exit 1; }

      # ---- Developer ID signing and notarization: skipped unless the ----
      # ---- MACOS_CERTIFICATE_P12 secret exists (see README.md here). ----
      - name: "Signing (optional): import the Developer ID certificate"
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: "Signing (optional): sign the app with the hardened runtime"
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          identity="${MACOS_SIGNING_IDENTITY:-Developer ID Application}"
          codesign --force --deep --options runtime --timestamp \
            --entitlements mac/Hearsay/Hearsay.entitlements --sign "$identity" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Make the DMG
        run: mac/Scripts/make-dmg.sh "$APP" "$VERSION" "$DMG"

      - name: "Signing (optional): sign, notarize, and staple the DMG"
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"

      - name: "Signing (optional): remove the temporary keychain"
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          [[ -n ${KEYCHAIN:-} ]] && security delete-keychain "$KEYCHAIN" || true

      - name: Checksums and release notes
        run: |
          (cd dist && shasum -a 256 "Hearsay-$VERSION.dmg" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            echo "## Install"
            echo
            echo "Download \`Hearsay-$VERSION.dmg\`, open it, and drag Hearsay to Applications."
            echo "Requires a Mac with Apple Silicon and macOS 14 or later."
            echo
            if [[ $HAS_SIGNING == true ]]; then
              echo "This build is signed with Developer ID and notarized by Apple."
            else
              echo "**This build is not notarized** (ad-hoc signed). macOS blocks it the first time:"
              echo
              echo "- macOS 14: right-click Hearsay in Applications, choose Open, then Open again."
              echo "- macOS 15 and later: open Hearsay once, then go to System Settings > Privacy & Security and click Open Anyway."
            fi
            echo
            echo "Verify the download: \`shasum -a 256 -c SHA256SUMS.txt\` in the folder with both files."
          } > dist/release-notes.md
          cat dist/release-notes.md

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Hearsay ${{ env.VERSION }}
          body_path: dist/release-notes.md
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/Hearsay-${{ env.VERSION }}.dmg
            dist/SHA256SUMS.txt
