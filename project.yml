# XcodeGen spec for Hearsay. Regenerate the project with
# Scripts/generate-project.sh; Hearsay.xcodeproj is not tracked.
name: Hearsay
options:
  bundleIdPrefix: tw.og1o
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  HearsayCore:
    path: HearsayCore
targets:
  Hearsay:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Hearsay
        excludes:
          - Info.plist
          - Hearsay.entitlements
    dependencies:
      - package: HearsayCore
        product: HearsayCore
    info:
      path: Hearsay/Info.plist
      properties:
        CFBundleDisplayName: Hearsay
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Hearsay records meetings you start and transcribes them on this Mac.
        NSAudioCaptureUsageDescription: Hearsay captures the audio of your calls so both sides of a meeting are transcribed.
    entitlements:
      path: Hearsay/Hearsay.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.og1o.hearsay
        PRODUCT_NAME: Hearsay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
    scheme: {}
